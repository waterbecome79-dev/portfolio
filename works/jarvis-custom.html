  <main>
    <p class="back"><a href="../index.html">返回索引</a></p>

    <h1>贾维斯定制</h1>
    <p class="meta">开源项目上的定制。底座不是我从零写的。</p>
    <p>底座是开源项目 <a href="https://github.com/shitoudaidi/GDDXX-Jarvis">GDDXX-Jarvis</a>。我在本机安装并做了定制，桌面上也把它和原版分开标注。</p>

    <figure>
      <img src="../assets/jarvis/hud.png" alt="本机界面：定制版贾维斯的完整界面">
      <figcaption>本机界面：定制版贾维斯的完整界面。关掉这个窗口不等于退出，托盘里仍可继续运行。</figcaption>
    </figure>

    <h2>已核对的定制</h2>
    <ul>
      <li><strong>本机 HTTP API</strong>：给别的程序调用，不朗读。</li>
      <li><strong>托盘</strong>：关掉窗口不等于退出，服务可以继续留在后台。</li>
      <li><strong>与团队工作台对接</strong>：把口述任务交给团队工作台，再读回结果。</li>
    </ul>
    <p>本页只写这些定制，不把上游项目本身写成我的作品，也不在这里改或发布它的源码。</p>

    <footer>
      本站使用 GitHub Pages 免费发布，目前只有二级路径，没有自己的域名。
    </footer>
  </main>
</body>
</html>

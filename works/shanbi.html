<!DOCTYPE html>
<html lang="zh-Hans" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="google" content="notranslate">
  <title>闪避</title>
  <style>
    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      background: #f7f4ef;
      color: #1c1a17;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
      overscroll-behavior: none;
    }

    .wrap {
      width: min(100%, 28rem);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding: max(0.75rem, env(safe-area-inset-top)) max(0.85rem, env(safe-area-inset-right)) max(0.75rem, env(safe-area-inset-bottom)) max(0.85rem, env(safe-area-inset-left));
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .back, .how, .score {
      margin: 0;
      color: #5c574f;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    a { color: #1a4a73; }

    a:focus-visible {
      outline: 2px solid #1a4a73;
      outline-offset: 2px;
    }

    #stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 16rem;
      margin-top: 0.35rem;
      border: 1px solid #d9d3c8;
      border-radius: 8px;
      background: #fffdf9;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #over {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 1rem;
      background: rgba(247, 244, 239, 0.92);
      text-align: center;
    }

    #over:not([hidden]) { display: flex; }

    #over p { margin: 0; color: #5c574f; }

    #over .end-title {
      color: #1c1a17;
      font-size: 1.5rem;
      font-weight: 600;
    }

    #over .restart {
      margin-top: 0.4rem;
      color: #1c1a17;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="back"><a href="../index.html">返回索引</a></p>
    <h1>闪避</h1>
    <p class="how">手指左右拖，或按方向键和 A、D。躲开从上面落下的方块。</p>
    <p class="score">分数 <span id="score">0.0</span> 秒</p>
    <div id="stage">
      <canvas id="play" width="440" height="640" aria-hidden="true"></canvas>
      <div id="over" hidden>
        <p class="end-title">撞上了</p>
        <p>分数 <span id="final">0.0</span> 秒</p>
        <p class="restart">点一下再来</p>
      </div>
    </div>
    <noscript><p>需要打开 JavaScript 才能玩。</p></noscript>
  </div>
  <script>
    (function () {
      var canvas = document.getElementById("play");
      var ctx = canvas.getContext("2d");
      var stage = document.getElementById("stage");
      var scoreEl = document.getElementById("score");
      var finalEl = document.getElementById("final");
      var overEl = document.getElementById("over");
      var state = {
        w: 0,
        h: 0,
        playerX: 0,
        playerY: 0,
        playerW: 48,
        playerH: 64,
        obstacles: [],
        elapsed: 0,
        spawnIn: 0.55,
        over: false,
        pointer: false,
        pointerX: 0,
        left: false,
        right: false,
        shown: "0.0"
      };

      function clamp(v, a, b) {
        return Math.max(a, Math.min(b, v));
      }

      function resize() {
        var rect = stage.getBoundingClientRect();
        if (rect.width < 2 || rect.height < 2) return;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = rect.width;
        var h = rect.height;
        var sx = state.w ? w / state.w : 1;
        var sy = state.h ? h / state.h : 1;
        var i;
        if (state.w) {
          for (i = 0; i < state.obstacles.length; i++) {
            state.obstacles[i].x *= sx;
            state.obstacles[i].y *= sy;
            state.obstacles[i].w *= sx;
            state.obstacles[i].h *= sy;
            state.obstacles[i].vy *= sy;
          }
        }
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var ratio = state.w ? state.playerX / state.w : 0.5;
        state.w = w;
        state.h = h;
        state.playerH = clamp(h * 0.09, 52, 74);
        state.playerW = state.playerH * 0.62;
        state.playerY = h - state.playerH - clamp(h * 0.045, 12, 26);
        state.playerX = clamp(ratio * w, state.playerW / 2, w - state.playerW / 2);
      }

      function reset() {
        state.obstacles = [];
        state.elapsed = 0;
        state.spawnIn = 0.55;
        state.over = false;
        state.shown = "0.0";
        scoreEl.textContent = "0.0";
        overEl.hidden = true;
        if (state.w) state.playerX = state.w / 2;
      }

      function showScore() {
        var text = state.elapsed.toFixed(1);
        if (text === state.shown) return;
        state.shown = text;
        scoreEl.textContent = text;
      }

      function endRun() {
        if (state.over) return;
        state.over = true;
        var text = state.elapsed.toFixed(1);
        state.shown = text;
        scoreEl.textContent = text;
        finalEl.textContent = text;
        overEl.hidden = false;
      }

      function spawn() {
        var w = state.w * (0.18 + Math.random() * 0.24);
        var h = clamp(state.h * 0.03, 16, 26);
        var x = Math.random() * (state.w - w);
        var vy = state.h * (0.28 + Math.min(0.4, state.elapsed * 0.012));
        state.obstacles.push({ x: x, y: -h - 2, w: w, h: h, vy: vy });
      }

      function hits(o) {
        var inset = 4;
        var x = state.playerX - state.playerW / 2 + inset;
        var y = state.playerY + inset;
        var w = state.playerW - inset * 2;
        var h = state.playerH - inset * 2;
        return x < o.x + o.w && x + w > o.x && y < o.y + o.h && y + h > o.y;
      }

      function update(dt) {
        var move;
        var i;
        var o;
        if (state.over || !state.w) return;
        move = state.w * 1.65 * dt;
        if (state.left) state.playerX -= move;
        if (state.right) state.playerX += move;
        if (state.pointer) state.playerX = state.pointerX;
        state.playerX = clamp(state.playerX, state.playerW / 2, state.w - state.playerW / 2);

        state.spawnIn -= dt;
        if (state.spawnIn <= 0) {
          spawn();
          state.spawnIn = Math.max(0.46, 0.9 - state.elapsed * 0.012);
        }

        for (i = 0; i < state.obstacles.length; i++) {
          o = state.obstacles[i];
          o.y += o.vy * dt;
          if (hits(o)) {
            endRun();
            return;
          }
        }
        state.obstacles = state.obstacles.filter(function (item) {
          return item.y < state.h + 30;
        });
        state.elapsed += dt;
        showScore();
      }

      function roundRect(x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function draw() {
        var w = state.w;
        var h = state.h;
        var floorY;
        var i;
        var o;
        var px;
        var top;
        var pw;
        var ph;
        if (!w || !h) return;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "#fffdf9";
        ctx.fillRect(0, 0, w, h);
        floorY = state.playerY + state.playerH + 8;
        ctx.strokeStyle = "#d9d3c8";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(12, floorY);
        ctx.lineTo(w - 12, floorY);
        ctx.stroke();
        ctx.fillStyle = "#1a4a73";
        for (i = 0; i < state.obstacles.length; i++) {
          o = state.obstacles[i];
          roundRect(o.x, o.y, o.w, o.h, 4);
          ctx.fill();
        }
        px = state.playerX;
        top = state.playerY;
        pw = state.playerW;
        ph = state.playerH;
        ctx.fillStyle = "#1c1a17";
        ctx.beginPath();
        ctx.arc(px, top + ph * 0.16, ph * 0.145, 0, Math.PI * 2);
        ctx.fill();
        roundRect(px - pw * 0.26, top + ph * 0.32, pw * 0.52, ph * 0.4, 5);
        ctx.fill();
        roundRect(px - pw * 0.42, top + ph * 0.74, pw * 0.32, ph * 0.2, 3);
        ctx.fill();
        roundRect(px + pw * 0.1, top + ph * 0.74, pw * 0.32, ph * 0.2, 3);
        ctx.fill();
      }

      function pointerX(e) {
        var rect = canvas.getBoundingClientRect();
        return e.clientX - rect.left;
      }

      document.addEventListener("pointerdown", function (e) {
        if (e.target && e.target.closest && e.target.closest("a")) return;
        if (state.over) reset();
        state.pointer = true;
        state.pointerX = pointerX(e);
        e.preventDefault();
      }, { passive: false });

      document.addEventListener("pointermove", function (e) {
        if (!state.pointer) return;
        state.pointerX = pointerX(e);
      });

      document.addEventListener("pointerup", function () {
        state.pointer = false;
      });

      document.addEventListener("pointercancel", function () {
        state.pointer = false;
      });

      window.addEventListener("keydown", function (e) {
        if (e.repeat) return;
        if (e.code === "ArrowLeft" || e.code === "KeyA") {
          state.left = true;
          e.preventDefault();
        } else if (e.code === "ArrowRight" || e.code === "KeyD") {
          state.right = true;
          e.preventDefault();
        }
      });

      window.addEventListener("keyup", function (e) {
        if (e.code === "ArrowLeft" || e.code === "KeyA") state.left = false;
        else if (e.code === "ArrowRight" || e.code === "KeyD") state.right = false;
      });

      window.addEventListener("blur", function () {
        state.left = false;
        state.right = false;
        state.pointer = false;
      });

      stage.addEventListener("contextmenu", function (e) {
        e.preventDefault();
      });

      window.addEventListener("resize", resize);

      var last = 0;
      function frame(t) {
        var dt;
        requestAnimationFrame(frame);
        if (!state.w) resize();
        if (document.hidden) {
          last = t;
          draw();
          return;
        }
        dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
        last = t;
        update(dt);
        draw();
      }

      resize();
      reset();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>

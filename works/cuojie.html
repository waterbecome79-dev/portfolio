    <p class="meta">自己的作品。写作过程有 AI 辅助。尚未完稿，也尚未上架。</p>
    <p>十九岁的沈皓，只是在一个雨夜下班的路上，踩进了一摊水。水里有一双眼睛，在看他。再抬头，河堤成了陌生的滨江步道。城市很像，却叫不出名字。手机里跳出一条未知短信：别再踩水。他回来了，却回不到从前。</p>
    <p>目前已写出第 1–30 章。第 1–21 章的整理稿约 4.5 万字，第 1–30 章正文合计约 6.7 万字（去空白）。这不是全书完稿。</p>
